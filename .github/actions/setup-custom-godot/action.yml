name: Setup custom Godot
description: Prepare the editor and bundled NuGet packages selected by Ciallo/global.json, with optional export templates.

inputs:
  templates:
    description: Download and install matching export templates for this platform.
    default: 'false'

outputs:
  editor_path:
    description: Located Godot editor executable path.
    value: ${{ steps.engine.outputs.editor_path }}

runs:
  using: composite
  steps:
    - name: Prepare engine bundle
      id: engine
      shell: bash
      env:
        INSTALL_TEMPLATES: ${{ inputs.templates }}
      run: |
        args=(sync --ci)
        if [ "$INSTALL_TEMPLATES" = true ]; then args+=(--templates); fi
        ./engine.sh "${args[@]}"
