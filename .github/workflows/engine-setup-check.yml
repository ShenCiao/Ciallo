name: Engine setup scripts

on:
  pull_request:
    paths:
      - engine.sh
      - tools/engine/**
      - Ciallo/global.json
      - Ciallo/Ciallo.csproj
      - NuGet.Config
      - Ciallo/.githooks/**
      - .github/workflows/engine-setup-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        runner: [windows-latest, ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Check provisioning and cleanup
        shell: pwsh
        run: ./tools/engine/test.ps1
