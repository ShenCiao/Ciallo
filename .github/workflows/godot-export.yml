name: Godot Export

# Shared export pipeline. `checkout_ref` selects the exact source commit;
# `release_ref` optionally applies stable or hotfix semantics before that tag exists.
#
# Distribution macOS builds use Godot codesign=3 with injected Developer ID
# settings, then notarize and emit Ciallo-macOS.zip. Build-only runs emit
# Ciallo-macOS-unsigned.zip.

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref to checkout and build (full ref like refs/tags/vX, or a bare tag/branch/SHA).
        required: true
        type: string
      release_ref:
        description: Optional stable or hotfix tag semantics while checkout_ref remains an exact pre-tag SHA.
        required: false
        default: ""
        type: string
      sign_macos:
        description: Sign, notarize, staple, verify, and zip the macOS app for distribution.
        required: false
        default: false
        type: boolean
    secrets:
      MACOS_CERTIFICATE_P12_BASE64:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      APP_STORE_CONNECT_API_ISSUER_ID:
        required: false
      APP_STORE_CONNECT_API_KEY_ID:
        required: false
      APP_STORE_CONNECT_API_PRIVATE_KEY:
        required: false
    outputs:
      project_version:
        value: ${{ jobs.meta.outputs.project_version }}
      head_sha:
        value: ${{ jobs.meta.outputs.head_sha }}
      engine_status:
        value: ${{ jobs.meta.outputs.engine_status }}
      engine_release_tag:
        value: ${{ jobs.meta.outputs.engine_release_tag }}
      sdk_version:
        value: ${{ jobs.meta.outputs.sdk_version }}
      release_title:
        value: ${{ jobs.meta.outputs.release_title }}

permissions:
  contents: read

env:
  PROJECT_PATH: Ciallo
  CSPROJ: Ciallo/Ciallo.csproj
  EXPORT_NAME: Ciallo
  GODOT_FEED: https://shenciao.github.io/godot/index.json
  GODOT_SDK_FLAT: https://shenciao.github.io/godot/flatcontainer/godot.net.sdk/index.json
  GODOT_RELEASE_REPO: ShenCiao/godot
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  meta:
    name: Validate version and SDK
    runs-on: ubuntu-24.04
    outputs:
      artifact_retention_days: ${{ steps.meta.outputs.artifact_retention_days }}
      engine_release_tag: ${{ steps.meta.outputs.engine_release_tag }}
      engine_status: ${{ steps.meta.outputs.engine_status }}
      head_sha: ${{ steps.meta.outputs.head_sha }}
      release_title: ${{ steps.meta.outputs.release_title }}
      project_version: ${{ steps.meta.outputs.project_version }}
      sdk_version: ${{ steps.meta.outputs.sdk_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref }}
          fetch-depth: 0
          lfs: true
          submodules: true

      - name: Validate metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_REF: ${{ inputs.checkout_ref }}
          RELEASE_REF: ${{ inputs.release_ref }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Read-GodotSetting([string]$Path, [string]$Key) {
            $line = Get-Content -LiteralPath $Path | Where-Object { $_ -match "^$([regex]::Escape($Key))=" } | Select-Object -First 1
            if (-not $line) {
              throw "Missing setting '$Key' in $Path"
            }
            $value = $line.Substring($line.IndexOf("=") + 1).Trim()
            if ($value.StartsWith('"') -and $value.EndsWith('"')) {
              $value = $value.Substring(1, $value.Length - 2)
            }
            return $value
          }

          $projectFile = Join-Path $env:PROJECT_PATH "project.godot"
          $projectName = Read-GodotSetting $projectFile "config/name"
          $projectVersion = Read-GodotSetting $projectFile "config/version"
          if ($projectVersion -notmatch "^\d+\.\d+\.\d+$") {
            throw "project.godot config/version must be plain semver X.Y.Z. Actual: $projectVersion"
          }

          [xml]$csproj = Get-Content -LiteralPath $env:CSPROJ
          $sdk = $csproj.Project.Sdk
          if ($sdk -notmatch "^Godot\.NET\.Sdk/(?<version>\d+\.\d+\.\d+-ciallo\.g(?<sha>[0-9a-f]+))$") {
            throw "C# project must use published custom Godot SDK: Godot.NET.Sdk/<semver>-ciallo.g<sha>. Actual: $sdk"
          }

          $sdkVersion = $Matches.version
          $engineStatus = "ciallo.g$($Matches.sha)"

          $sdkIndex = Invoke-RestMethod -Uri $env:GODOT_SDK_FLAT
          if ($sdkIndex.versions -notcontains $sdkVersion) {
            throw "SDK '$sdkVersion' is not published on public feed '$env:GODOT_SDK_FLAT'."
          }

          $headers = @{
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            Authorization = "Bearer $env:GH_TOKEN"
          }
          $templateAssets = @(
            "godot-export-templates-windows-x86_64-$engineStatus.zip"
            "godot-export-templates-linux-x86_64-$engineStatus.zip"
            "godot-export-templates-macos-arm64-$engineStatus.zip"
          )
          $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GODOT_RELEASE_REPO/releases?per_page=100" -Headers $headers
          $engineRelease = $releases | Where-Object {
            $assetNames = @($_.assets.name)
            @($templateAssets | Where-Object { $_ -notin $assetNames }).Count -eq 0
          } | Select-Object -First 1
          if (-not $engineRelease) {
            throw "Could not find a $env:GODOT_RELEASE_REPO release containing all export templates for '$engineStatus'."
          }
          $engineReleaseTag = $engineRelease.tag_name

          $headSha = (git rev-parse HEAD).Trim()

          $tagKind = "branch"
          $hotfixBaseVersion = ""
          $isRelease = "false"
          $isPrerelease = "false"
          $releaseTitle = "$projectName $projectVersion"
          $retention = "2"

          # release_ref carries release semantics for pre-tag builds. Otherwise
          # checkout_ref decides whether this is a release tag.
          $checkoutRef = $env:CHECKOUT_REF
          $semanticRef = if ([string]::IsNullOrEmpty($env:RELEASE_REF)) { $checkoutRef } else { $env:RELEASE_REF }
          $refName = $semanticRef
          $treatAsTag = $false
          if ($semanticRef.StartsWith("refs/tags/")) {
            $treatAsTag = $true
            $refName = $semanticRef.Substring("refs/tags/".Length)
          } elseif ($semanticRef.StartsWith("refs/")) {
            $treatAsTag = $false
          } elseif ($semanticRef -match "^v\d+\.\d+\.\d+(-hotfix\.\d+)?$") {
            $treatAsTag = $true
            $refName = $semanticRef
          }

          if ($treatAsTag) {
            if ($refName -match "^v(?<version>\d+\.\d+\.\d+)-hotfix\.(?<number>[1-9]\d*)$") {
              $hotfixVersion = $Matches.version
              $hotfixTag = "v$hotfixVersion"
              if ($hotfixVersion -ne $projectVersion) {
                throw "Hotfix tag base version '$hotfixVersion' must match project.godot config/version '$projectVersion'. Do not write the hotfix suffix into project.godot."
              }
              git merge-base --is-ancestor HEAD origin/main
              if ($LASTEXITCODE -ne 0) {
                throw "Hotfix tag '$refName' must point to a commit contained in origin/main."
              }
              $latestStable = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/latest" -Headers $headers
              if ($latestStable.tag_name -ne $hotfixTag) {
                throw "Hotfix tag '$refName' is only allowed for the latest stable release. Latest stable: '$($latestStable.tag_name)'."
              }
              $tagKind = "hotfix"
              $hotfixBaseVersion = $hotfixVersion
              $isRelease = "true"
              $isPrerelease = "true"
              $releaseTitle = "$projectName $refName"
              $retention = "30"
            } elseif ($refName -match "^v(?<version>\d+\.\d+\.\d+)$") {
              if ($Matches.version -ne $projectVersion) {
                throw "Release tag version '$($Matches.version)' must match project.godot config/version '$projectVersion'."
              }
              git merge-base --is-ancestor HEAD origin/main
              if ($LASTEXITCODE -ne 0) {
                throw "Release tag '$refName' must point to a commit contained in origin/main."
              }
              $tagKind = "release"
              $isRelease = "true"
              $isPrerelease = "false"
              $releaseTitle = "$projectName $refName"
              $retention = "30"
            } else {
              throw "Unsupported tag '$refName'. Use vX.Y.Z-hotfix.N or vX.Y.Z."
            }
          }

          "artifact_retention_days=$retention" >> $env:GITHUB_OUTPUT
          "engine_release_tag=$engineReleaseTag" >> $env:GITHUB_OUTPUT
          "engine_status=$engineStatus" >> $env:GITHUB_OUTPUT
          "head_sha=$headSha" >> $env:GITHUB_OUTPUT
          "release_title=$releaseTitle" >> $env:GITHUB_OUTPUT
          "project_version=$projectVersion" >> $env:GITHUB_OUTPUT
          "sdk_version=$sdkVersion" >> $env:GITHUB_OUTPUT

          "Project: $projectName $projectVersion"
          "Commit: $headSha"
          "Godot SDK: $sdkVersion"
          "Engine status: $engineStatus"
          "Engine release: $engineReleaseTag"
          "Checkout ref: $checkoutRef"
          "Release ref: $env:RELEASE_REF"
          "Tag kind: $tagKind"

      - name: Validate localization CSV
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import pathlib
          import sys

          failed = False
          for path in sorted(pathlib.Path("Ciallo/Localization").glob("*.csv")):
              with path.open("r", encoding="utf-8-sig", newline="") as stream:
                  rows = list(csv.reader(stream))

              expected_width = len(rows[0])
              for row_number, row in enumerate(rows, start=1):
                  if len(row) != expected_width:
                      print(
                          f"{path}:{row_number}: expected {expected_width} columns, got {len(row)}",
                          file=sys.stderr,
                      )
                      failed = True

          if failed:
              sys.exit(1)
          PY

  export:
    name: Export ${{ matrix.name }}
    needs: meta
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            editor_asset: godot-windows-x86_64
            editor_glob: godot*.exe
            template_asset: godot-export-templates-windows-x86_64
            preset: Windows Desktop
            output_dir: build/windows
            output_file: Ciallo.exe
            artifact: Ciallo-Windows
            package: packages/Ciallo-Windows.zip
          - name: Linux
            runner: ubuntu-24.04
            editor_asset: godot-linuxbsd-x86_64
            editor_glob: godot*
            template_asset: godot-export-templates-linux-x86_64
            preset: Linux
            output_dir: build/linux
            output_file: Ciallo
            artifact: Ciallo-Linux
            package: packages/Ciallo-Linux.zip
          - name: macOS
            runner: macos-26
            editor_asset: godot-macos-arm64
            editor_glob: godot*
            template_asset: godot-export-templates-macos-arm64
            preset: macOS
            output_dir: build/macos
            output_file: Ciallo.app
            artifact: Ciallo-macOS
            package: packages/*.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref }}
          lfs: true
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup custom Godot
        id: godot
        uses: ./.github/actions/setup-custom-godot
        with:
          engine_release_tag: ${{ needs.meta.outputs.engine_release_tag }}
          engine_status: ${{ needs.meta.outputs.engine_status }}
          editor_asset: ${{ matrix.editor_asset }}
          editor_glob: ${{ matrix.editor_glob }}
          template_asset: ${{ matrix.template_asset }}
          release_repo: ${{ env.GODOT_RELEASE_REPO }}
          github_token: ${{ github.token }}

      - name: Import signing certificate
        # Imports the Developer ID cert into a temporary keychain for Godot codesign=3.
        if: matrix.name == 'macOS' && inputs.sign_macos
        id: import_codesign_certs
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Prepare signing keychain
        # Avoid CI keychain access prompts before Godot/codesign touch the imported private key.
        if: matrix.name == 'macOS' && inputs.sign_macos
        env:
          KEYCHAIN_PASSWORD: ${{ steps.import_codesign_certs.outputs['keychain-password'] }}
        shell: bash
        run: |
          set -euo pipefail
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" signing_temp.keychain
          security set-keychain-settings -lut 21600 signing_temp.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" signing_temp.keychain
          security find-identity -v -p codesigning signing_temp.keychain

      - name: Inject macOS signing identity into export preset
        if: matrix.name == 'macOS' && inputs.sign_macos
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_CODESIGN_IDENTITY: ${{ vars.MACOS_CODESIGN_IDENTITY }}
          PROJECT_VERSION: ${{ needs.meta.outputs.project_version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Inject version/team/identity; blank team or identity would fall back to ad-hoc signing.
          if ([string]::IsNullOrEmpty($env:MACOS_CODESIGN_IDENTITY) -or [string]::IsNullOrEmpty($env:APPLE_TEAM_ID)) {
            throw "sign_macos requires the MACOS_CODESIGN_IDENTITY and APPLE_TEAM_ID repository variables."
          }
          $preset = Join-Path $env:PROJECT_PATH "export_presets.cfg"
          $presetText = Get-Content -LiteralPath $preset -Raw
          $macPresetMatch = [regex]::Match(
            $presetText,
            '(?ms)^\[preset\.(?<index>\d+)\]\s*(?:(?!^\[preset\.\d+(?:\.options)?\]).)*?^name="macOS"\s*$(?:(?!^\[preset\.\d+(?:\.options)?\]).)*?^platform="macOS"\s*$'
          )
          if (-not $macPresetMatch.Success) {
            throw "Could not find the macOS export preset."
          }
          $macOptionsHeader = "[preset.$($macPresetMatch.Groups["index"].Value).options]"

          function Set-PresetOption([string]$Key, [string]$Value) {
            $escapedKey = [regex]::Escape($Key)
            $content = Get-Content -LiteralPath $preset
            $matched = $false
            $inMacOptions = $false
            $content = $content | ForEach-Object {
              if ($_ -eq $macOptionsHeader) {
                $inMacOptions = $true
                $_
              } elseif ($inMacOptions -and $_ -match "^\[preset\.\d+(\.options)?\]$") {
                $inMacOptions = $false
                $_
              } elseif ($inMacOptions -and $_ -match "^$escapedKey=") {
                $matched = $true
                "$Key=$Value"
              } else {
                $_
              }
            }
            if (-not $matched) {
              throw "Missing export preset option '$Key'."
            }
            Set-Content -LiteralPath $preset -Value $content
          }

          Set-PresetOption "application/short_version" "`"$env:PROJECT_VERSION`""
          Set-PresetOption "application/version" "`"$env:PROJECT_VERSION`""
          Set-PresetOption "codesign/apple_team_id" "`"$env:APPLE_TEAM_ID`""
          Set-PresetOption "codesign/identity" "`"$env:MACOS_CODESIGN_IDENTITY`""

      - name: Restore
        shell: pwsh
        run: dotnet restore "$env:CSPROJ" --configfile NuGet.Config

      - name: Import resources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Filter expected first-scan noise before Godot finishes importing resources.
          $noise = "res://Localization/.+\.translation|resource_format_binary\.cpp:1220|resource_loader\.cpp:343|Failed to create an autoload, script 'res://.+\.cs' is not compiling|_create_autoload \(editor/settings/editor_autoload_settings\.cpp:409\)"
          Push-Location $env:PROJECT_PATH
          & "${{ steps.godot.outputs.editor_path }}" --headless --import 2>&1 |
            Where-Object { $_ -notmatch $noise }
          $importExitCode = $LASTEXITCODE
          Pop-Location

          if ($importExitCode -ne 0) {
            throw "Godot resource import failed with exit code $importExitCode."
          }

      - name: Export release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $outDir = Join-Path (Get-Location) "${{ matrix.output_dir }}"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $outFile = Join-Path $outDir "${{ matrix.output_file }}"
          # Filter expected C# autoload first-scan noise before Godot publishes .NET.
          $noise = "Failed to create an autoload, script 'res://.+\.cs' is not compiling|_create_autoload \(editor/settings/editor_autoload_settings\.cpp:409\)"

          Push-Location $env:PROJECT_PATH
          & "${{ steps.godot.outputs.editor_path }}" --headless --export-release "${{ matrix.preset }}" $outFile 2>&1 |
            Where-Object { $_ -notmatch $noise }
          $exportExitCode = $LASTEXITCODE
          Pop-Location

          if ($exportExitCode -ne 0) {
            throw "Godot export failed with exit code $exportExitCode."
          }
          if (-not (Test-Path -LiteralPath $outFile)) {
            throw "Export did not create expected output: $outFile"
          }

          $expectedAssets = switch ("${{ matrix.name }}") {
            "Windows" { @("Facepunch.Steamworks.Win64.dll", "steam_api64.dll") }
            "Linux" { @("Facepunch.Steamworks.Posix.dll", "libsteam_api.so") }
            "macOS" { @("Facepunch.Steamworks.Posix.dll", "libsteam_api.dylib") }
          }
          $forbiddenAssets = switch ("${{ matrix.name }}") {
            "Windows" { @("Facepunch.Steamworks.Posix.dll", "libsteam_api.so", "libsteam_api.dylib") }
            "Linux" { @("Facepunch.Steamworks.Win64.dll", "steam_api64.dll", "libsteam_api.dylib") }
            "macOS" { @("Facepunch.Steamworks.Win64.dll", "steam_api64.dll", "libsteam_api.so") }
          }
          $assetRoot = if ("${{ matrix.name }}" -eq "macOS") { $outFile } else { $outDir }
          $exportedFiles = @(Get-ChildItem -LiteralPath $assetRoot -Recurse -File)

          foreach ($asset in $expectedAssets) {
            if ($exportedFiles.Name -cnotcontains $asset) {
              throw "Export is missing expected Steamworks asset '$asset'."
            }
          }
          foreach ($asset in $forbiddenAssets) {
            if ($exportedFiles.Name -ccontains $asset) {
              throw "Export contains Steamworks asset '$asset' from another platform."
            }
          }

      - name: Package Windows
        if: matrix.name == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path packages | Out-Null
          Compress-Archive -Path "${{ matrix.output_dir }}/*" -DestinationPath "${{ matrix.package }}" -Force

      - name: Package Linux
        if: matrix.name == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages
          (
            cd "${{ matrix.output_dir }}"
            chmod +x Ciallo
            zip -r -q "$GITHUB_WORKSPACE/${{ matrix.package }}" .
          )

      - name: Notarize, staple, verify, and package macOS app
        # Godot already signed the bundle; this step notarizes, staples, verifies, and zips it.
        if: matrix.name == 'macOS' && inputs.sign_macos
        timeout-minutes: 20
        env:
          APP_PATH: build/macos/Ciallo.app
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          codesign --verify --strict --verbose=2 "$APP_PATH"

          # Restore flattened PEM newlines for notarytool.
          app_store_key="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          APP_STORE_KEY="$app_store_key" python3 - <<'PY'
          import os
          from pathlib import Path

          value = os.environ["APP_STORE_CONNECT_API_PRIVATE_KEY"]
          if "\\n" in value and "-----BEGIN" in value:
              value = value.replace("\\n", "\n")
          if not value.endswith("\n"):
              value += "\n"
          Path(os.environ["APP_STORE_KEY"]).write_text(value)
          PY
          chmod 600 "$app_store_key"

          # Notary zip is separate; the distributable zip is made after stapling.
          mkdir -p notary packages
          ditto -c -k --keepParent "$APP_PATH" notary/Ciallo-macOS-notary.zip

          notary_credentials=(
            --key "$app_store_key"
            --key-id "$APP_STORE_CONNECT_API_KEY_ID"
            --issuer "$APP_STORE_CONNECT_API_ISSUER_ID"
          )

          dump_notary_diagnostics() {
            local reason="$1"
            echo "Notary diagnostics: $reason; submission_id=${submission_id:-unknown}"

            if [[ -n "${submission_id:-}" ]]; then
              echo "::group::notarytool info"
              xcrun notarytool info "$submission_id" "${notary_credentials[@]}" --output-format json || true
              echo "::endgroup::"

              echo "::group::notarytool log"
              xcrun notarytool log "$submission_id" "${notary_credentials[@]}" notary/notary-log.json || true
              cat notary/notary-log.json || true
              echo "::endgroup::"
            fi

            echo "::group::notarytool history"
            xcrun notarytool history "${notary_credentials[@]}" --output-format json || true
            echo "::endgroup::"
          }

          if ! submit_json="$(xcrun notarytool submit notary/Ciallo-macOS-notary.zip "${notary_credentials[@]}" --output-format json)"; then
            echo "notarytool submit failed or timed out."
            exit 1
          fi
          printf '%s\n' "$submit_json"
          submission_id="$(python3 -c 'import json, sys; print(json.load(sys.stdin)["id"])' <<<"$submit_json")"
          echo "Notary submission id: $submission_id"

          deadline=$((SECONDS + 15 * 60))
          wait_started_at=$SECONDS
          while true; do
            elapsed=$((SECONDS - wait_started_at))
            info_json="$(xcrun notarytool info "$submission_id" "${notary_credentials[@]}" --output-format json)"
            status="$(python3 -c 'import json, sys; print(json.load(sys.stdin)["status"])' <<<"$info_json")"
            echo "Notarization status: $status; elapsed=${elapsed}s; submission_id=$submission_id"
            printf '%s\n' "$info_json"

            case "$status" in
              "Accepted")
                break
                ;;
              "Invalid"|"Rejected")
                dump_notary_diagnostics "terminal status: $status"
                exit 1
                ;;
            esac

            if (( SECONDS >= deadline )); then
              echo "Timed out waiting for notarization after 15 minutes."
              dump_notary_diagnostics "timeout after ${elapsed}s"
              exit 1
            fi

            sleep 60
          done

          xcrun stapler staple "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" packages/Ciallo-macOS.zip

      - name: Package unsigned macOS app
        if: matrix.name == 'macOS' && !inputs.sign_macos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages
          ditto -c -k --keepParent build/macos/Ciallo.app packages/Ciallo-macOS-unsigned.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.package }}
          retention-days: ${{ needs.meta.outputs.artifact_retention_days }}
          if-no-files-found: error
