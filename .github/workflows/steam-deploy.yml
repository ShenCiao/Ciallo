name: Manual Steam Deploy

# Manual fallback for Steam uploads.
# Supports rebuilding from build_ref or reusing artifacts from existing_run.
# Shared upload work lives in steam-upload.yml.

on:
  workflow_dispatch:
    inputs:
      source_mode:
        description: Build from a ref or reuse existing artifacts.
        type: choice
        required: true
        default: build_ref
        options:
          - build_ref
          - existing_run
      build_ref:
        description: Branch, tag, or SHA for build_ref mode. Empty builds the branch used to run this workflow.
        required: false
      run_id:
        description: Run id for existing_run mode.
        required: false
      steam_branch:
        description: 'Steam branch to set live; "default" uploads only and needs manual promotion.'
        required: false
        default: default
      app_id:
        description: Steam app id. Empty uses STEAM_APP_ID.
        required: false
      build_description:
        description: Custom build description. Empty auto-generates.
        required: false
      dry_run:
        description: Preview parameters without uploading.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  export:
    name: Build from ref
    if: inputs.source_mode == 'build_ref'
    uses: ./.github/workflows/godot-export.yml
    permissions:
      contents: read
    with:
      checkout_ref: ${{ inputs.build_ref || github.ref_name }}
      sign_macos: true
    secrets: inherit

  meta:
    name: Resolve source metadata
    needs:
      - export
    # existing_run skips export, so keep this job alive with always().
    if: >-
      always() &&
      (inputs.source_mode == 'existing_run' || needs.export.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      app_id: ${{ steps.meta.outputs.app_id }}
      project_version: ${{ steps.meta.outputs.project_version }}
      head_sha: ${{ steps.meta.outputs.head_sha }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      source_label: ${{ steps.meta.outputs.source_label }}
      download_run_id: ${{ steps.meta.outputs.download_run_id }}
    steps:
      - name: Resolve source metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_MODE: ${{ inputs.source_mode }}
          RUN_ID: ${{ inputs.run_id }}
          BUILD_REF: ${{ inputs.build_ref || github.ref_name }}
          EXPORT_VERSION: ${{ needs.export.outputs.project_version }}
          EXPORT_SHA: ${{ needs.export.outputs.head_sha }}
          INPUT_APP_ID: ${{ inputs.app_id }}
          DEFAULT_APP_ID: ${{ vars.STEAM_APP_ID }}
        shell: bash
        run: |
          set -euo pipefail

          app_id="${INPUT_APP_ID:-$DEFAULT_APP_ID}"
          if [ -z "$app_id" ]; then
            echo "No app id: set the app_id input or the STEAM_APP_ID repo variable."
            exit 1
          fi
          echo "app_id=$app_id" >> "$GITHUB_OUTPUT"

          if [ "$SOURCE_MODE" = "build_ref" ]; then
            version="$EXPORT_VERSION"
            sha="$EXPORT_SHA"
            source_label="$BUILD_REF"
            download_run_id=""
          else
            if [ -z "${RUN_ID:-}" ]; then
              echo "source_mode=existing_run requires run_id."
              exit 1
            fi
            download_run_id="$RUN_ID"
            source_label="run $RUN_ID"

            # Use the artifact run's commit in the Steam build description.
            sha="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.head_sha' || true)"
            if [ -z "${sha:-}" ] || [ "$sha" = "null" ]; then
              echo "Could not read head_sha for run $RUN_ID."
              exit 1
            fi

            version="unknown"
            project_raw="$(gh api "repos/$REPO/contents/Ciallo/project.godot?ref=$sha" \
              -H "Accept: application/vnd.github.raw" 2>/dev/null || true)"
            if [ -n "$project_raw" ]; then
              parsed="$(printf '%s\n' "$project_raw" \
                | grep -E '^config/version=' | head -n 1 | sed -E 's/^config\/version="?([^"]*)"?$/\1/')"
              if [ -n "$parsed" ]; then
                version="$parsed"
              fi
            fi
          fi

          short_sha="${sha:0:7}"
          {
            echo "project_version=$version"
            echo "head_sha=$sha"
            echo "short_sha=$short_sha"
            echo "source_label=$source_label"
            echo "download_run_id=$download_run_id"
          } >> "$GITHUB_OUTPUT"

  deploy:
    name: Upload to Steam
    needs:
      - export
      - meta
    # existing_run skips export here too.
    if: >-
      always() &&
      needs.meta.result == 'success' &&
      (inputs.source_mode == 'existing_run' || needs.export.result == 'success')
    uses: ./.github/workflows/steam-upload.yml
    permissions:
      contents: read
      actions: read
    with:
      source_mode: ${{ inputs.source_mode }}
      source_label: ${{ needs.meta.outputs.source_label }}
      project_version: ${{ needs.meta.outputs.project_version }}
      head_sha: ${{ needs.meta.outputs.head_sha }}
      build_kind: manual
      app_id: ${{ needs.meta.outputs.app_id }}
      steam_branch: ${{ inputs.steam_branch }}
      build_description: ${{ inputs.build_description }}
      download_run_id: ${{ needs.meta.outputs.download_run_id }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
